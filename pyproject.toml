[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "supplychain-decision-agent"
version = "0.1.0"
description = "An evaluated LLM-to-MILP replenishment decision assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "scipy>=1.14,<2",
  "numpy>=2.0,<3",
  "httpx>=0.28,<1",
  "rich>=13.9,<15",
  "faiss-cpu>=1.10,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
supplychain = "supplychain_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/supplychain_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

